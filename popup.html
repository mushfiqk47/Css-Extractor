<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Tokens Extractor</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #ffffff;
      --text-color: #1f2937;
      --secondary-text: #6b7280;
      --border-color: #e5e7eb;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #111827;
        --text-color: #f9fafb;
        --secondary-text: #9ca3af;
        --border-color: #374151;
      }
    }

    body {
      width: 320px;
      padding: 0;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .container {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .icon-img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: contain;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 13px;
    }

    .stat-item {
      background: var(--border-color);
      background-opacity: 0.1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-value {
      font-weight: 700;
      font-size: 18px;
      display: block;
      margin-bottom: 4px;
    }

    .stat-label {
      color: var(--secondary-text);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      margin-top: 8px;
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    .btn-primary:disabled, .btn-secondary:disabled {
      background-color: var(--secondary-text);
      cursor: not-allowed;
      opacity: 0.7;
      border: none;
      color: white;
    }

    .status {
      font-size: 13px;
      text-align: center;
      min-height: 20px;
      color: var(--secondary-text);
    }

    .status.success { color: var(--success-color); }
    .status.error { color: var(--error-color); }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading .spinner {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="Icon.png" alt="App Icon" class="icon-img">
      <h1>Design Tokens</h1>
    </header>

    <div class="stats">
      <div class="stat-item">
        <span class="stat-value" id="styleTagCount">-</span>
        <span class="stat-label">Sources</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="linkTagCount">-</span>
        <span class="stat-label">External</span>
      </div>
    </div>

    <div id="status" class="status">Ready to export</div>

    <button id="extractBtn" class="btn-primary">
      <span class="spinner"></span>
      <span class="btn-text">Export JSON for Figma</span>
    </button>
    
    <button id="copyBtn" class="btn-secondary">
      <span class="btn-text">Copy JSON to Clipboard</span>
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
