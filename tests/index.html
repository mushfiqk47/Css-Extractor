<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Extractor Tests</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .pass { color: green; }
    .fail { color: red; font-weight: bold; }
    .test-case { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; }
    h2 { border-bottom: 2px solid #333; padding-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Test Suite</h1>
  <div id="results">Running tests...</div>

  <script type="module">
    import { extractDesignTokens } from '../src/core/extractor.js';
    import { CONFIG } from '../src/core/config.js';

    const results = document.getElementById('results');
    results.innerHTML = '';

    function assert(desc, condition) {
      const div = document.createElement('div');
      div.className = 'test-case';
      if (condition) {
        div.innerHTML = `<span class="pass">✓ PASS</span>: ${desc}`;
      } else {
        div.innerHTML = `<span class="fail">✗ FAIL</span>: ${desc}`;
        console.error(`Test failed: ${desc}`);
      }
      results.appendChild(div);
    }

    function runTests() {
      // Test 1: Basic Variable Extraction
      const css1 = `:root { --primary: #000000; --bg-color: white; }`;
      const tokens1 = extractDesignTokens(css1);
      
      assert('Extracts "primary" color from variable', 
        tokens1[CONFIG.GROUPS.OTHER]['primary']?.value === 'rgb(0, 0, 0)' || 
        tokens1[CONFIG.GROUPS.OTHER]['primary']?.value === '#000000');
      
      assert('Categorizes "bg-color" as Background', 
        tokens1[CONFIG.GROUPS.BG]['bg-color']?.value === 'rgb(255, 255, 255)' ||
        tokens1[CONFIG.GROUPS.BG]['bg-color']?.value === 'white');

      // Test 2: Property Extraction
      const css2 = `body { background-color: #ff0000; color: blue; border: 1px solid #00ff00; }`;
      const tokens2 = extractDesignTokens(css2);
      
      // Note: The exact generated name (generated-background-1) depends on order, but we check existence of value
      const bgValues = Object.values(tokens2[CONFIG.GROUPS.BG]).map(t => t.value);
      assert('Extracts background-color property', 
        bgValues.includes('rgb(255, 0, 0)') || bgValues.includes('#ff0000'));

      const textValues = Object.values(tokens2[CONFIG.GROUPS.TEXT]).map(t => t.value);
      assert('Extracts color property', 
        textValues.includes('rgb(0, 0, 255)') || textValues.includes('blue'));

      // Test 3: Font Extraction
      const css3 = `body { font-family: "Inter", sans-serif; }`;
      const tokens3 = extractDesignTokens(css3);
      const fontValues = Object.values(tokens3[CONFIG.GROUPS.FONT]).map(t => t.value);
      
      assert('Extracts font-family', fontValues.includes('Inter, sans-serif'));
      
      // Test 4: Invalid Colors
      const css4 = `div { color: none; background: transparent; }`;
      const tokens4 = extractDesignTokens(css4);
      const allColors = [
        ...Object.values(tokens4[CONFIG.GROUPS.TEXT]),
        ...Object.values(tokens4[CONFIG.GROUPS.BG])
      ];
      assert('Ignores "none" and "transparent"', allColors.length === 0);
    }

    try {
      runTests();
    } catch (e) {
      const div = document.createElement('div');
      div.className = 'fail';
      div.textContent = 'CRITICAL ERROR: ' + e.message;
      results.appendChild(div);
      console.error(e);
    }
  </script>
</body>
</html>
